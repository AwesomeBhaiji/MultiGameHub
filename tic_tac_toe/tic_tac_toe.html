<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MultiGameHub | Tic Tac Toe</title>
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="tic_tac_toe.css">
    </head>

    <body>
        <header>
            <h1><a href="../index.html">Tic Tac Toe</a></h1>
        </header>

        <main>
            <div class="main_section">
                <div id="board"></div>
                <div id="win_popup" class="popup"></div>
                <button id="restart">Restart</button>
            </div>
            
            <div id="side_section">
                <div class="card">
                    <h3>Colors:</h3>
                    <label class="col_container">
                        <p>Player 1's Color:</p>
                        <input id="p1_color_input" type="color" value="#002382">
                    </label>

                    <label class="col_container">
                        <p>Player 2's Color:</p>
                        <input id="p2_color_input" type="color" value="#230082">
                    </label>
                </div>
            </div>
        </main>

        <script src="../script.js"></script>
        <script src="tic_tac_toe.js"></script>
    </body>
</html>
